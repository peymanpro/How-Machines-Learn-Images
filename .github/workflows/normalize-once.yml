name: One-time quality normalization

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install tools
        run: python -m pip install -r requirements.txt ruff mypy
      - name: Auto-fix lint and format
        run: |
          ruff check --fix .
          ruff format .
      - name: Verify
        run: |
          python -m pytest -q
          ruff check .
          ruff format --check .
          mypy src
      - name: Commit normalized source
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: normalize Python formatting"
          git push origin HEAD:main
