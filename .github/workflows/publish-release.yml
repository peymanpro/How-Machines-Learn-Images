name: Publish Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  publish:
    if: startsWith(github.event.head_commit.message, 'release')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Run synthetic training smoke checks
        run: |
          python -m scripts.train_lines
          python -m scripts.run_experiments

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Strict Mypy
        run: mypy src

      - name: Validate release metadata
        id: metadata
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION must contain a semantic version such as 1.0.0"
            exit 1
          fi

          notes="docs/RELEASE-NOTES-v${version}.md"
          if [[ ! -f "$notes" ]]; then
            echo "::error::Missing release notes: $notes"
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null 2>&1; then
            echo "::error::Tag v${version} already exists"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          gh release create "v${RELEASE_VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "How Machines Learn Images v${RELEASE_VERSION}" \
            --notes-file "docs/RELEASE-NOTES-v${RELEASE_VERSION}.md" \
            --target "$GITHUB_SHA"
